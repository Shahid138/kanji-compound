<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0e0e10">
<title>JLPT Kanji Compounds</title>
<script type="application/json" id="claude-artifacts-manifest">{"permissions": []}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+JP:wght@400;500;600;700&family=Shippori+Mincho+B1:wght@500;700&display=swap" rel="stylesheet">
<style>
/* VOICE: a quiet, exact desktop dictionary — a tool you keep open for hours.
   IDEA: three panes like a printed kanji dictionary: index tabs, the character index, the entry page.
   PICTURE: the entry header — a large mincho kanji, its strokes drawing in a 田 grid, and a reading-usage bar.
   COLOUR and TYPE: neutral black surfaces, teal (浅葱) = on'yomi, amber (山吹) = kun'yomi; IBM Plex Sans JP for UI, Shippori Mincho for kanji.
   LAYOUT: full-window shell, each pane scrolls on its own; collapses to two panes, then one. */
:root{color-scheme:light dark;--z:1;
--bg:light-dark(#f1f1f2,#0e0e10);
--pane:light-dark(#f8f8f9,#141416);
--raise:light-dark(#ffffff,#19191c);
--line:light-dark(#dcdce0,#2a2a2f);
--line2:light-dark(#ebebee,#212125);
--ink:light-dark(#141416,#ededee);
--ink2:light-dark(#3a3a40,#c6c6cb);
--mute:light-dark(#6a6a72,#8d8d95);
--sel:light-dark(#2f5bd3,#86a8ff);
--onsel:light-dark(#ffffff,#0e0e10);--selbg:light-dark(#e6e6ea,#26262b);
--on:light-dark(#0f7a8a,#5ccfdf);--onbg:light-dark(#dff2f4,#10292d);
--kun:light-dark(#a96a00,#f2b84f);--kunbg:light-dark(#f8edd7,#2e2410);
--ok:light-dark(#2d7a4f,#6fd19a);
--btn:light-dark(#eeeef1,#26262b);--btnh:light-dark(#e3e3e8,#303036);--btnline:light-dark(#d2d2d8,#3a3a41);
--mincho:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho",serif;
--sans:"IBM Plex Sans JP","Hiragino Sans","Yu Gothic UI",system-ui,sans-serif}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--sans);overflow:hidden}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--sel);outline-offset:1px}
.mc{font-family:var(--mincho)}
.app{--w1:232px;--w2:400px;display:grid;grid-template-columns:var(--w1) var(--w2) minmax(0,1fr);grid-template-rows:minmax(0,1fr);height:calc(100vh / var(--z));width:100%}
.side{grid-area:1/1}.index{grid-area:1/2}.entry{grid-area:1/3}
.rz{grid-row:1;justify-self:start;width:11px;margin-left:-6px;z-index:6;cursor:col-resize;touch-action:none;position:relative;outline:none}
.rz::after{content:"";position:absolute;top:0;bottom:0;left:5px;width:1px;background:transparent;transition:background .12s,width .12s,left .12s}
.rz:hover::after,.rz.drag::after,.rz:focus-visible::after{background:var(--sel);width:3px;left:4px}
#rz1{grid-column:2}#rz2{grid-column:3}
body.resizing{cursor:col-resize;user-select:none}body.resizing *{cursor:col-resize!important}

/* ---------- sidebar ---------- */
.side{background:var(--bg);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:18px 14px 14px;gap:22px;overflow:auto}
.brand{display:flex;gap:10px;align-items:center;padding:0 6px}
.hb{flex:none;display:grid;place-items:center;width:36px;height:36px;border-radius:8px;border:1px solid transparent;background:none;color:var(--mute);margin-left:auto}
.hb:hover{background:var(--btn);border-color:var(--btnline);color:var(--ink)}
.srch{display:flex;gap:8px;align-items:center}.srch .search{flex:1}
.hb.show{display:none;margin-left:0;border-color:var(--btnline);background:var(--btn);color:var(--ink);height:40px;width:40px}
.hb.fab{display:none;position:fixed;top:12px;right:12px;z-index:9;border-color:var(--btnline);background:var(--raise);color:var(--ink);box-shadow:0 4px 14px rgb(0 0 0 / .25)}
body.navhidden .side,body.navhidden #rz1{display:none}
body.navhidden .app{grid-template-columns:0 var(--w2) minmax(0,1fr)}
body.navhidden .hb.show{display:grid}
.brand .mk{font:700 22px/1 var(--mincho);width:36px;height:36px;display:grid;place-items:center;border-radius:8px;background:var(--ink);color:var(--pane)}
.brand b{display:block;font-size:15px;line-height:1.2}
.brand small{color:var(--mute);font-size:12px}
.grp h3{margin:0 6px 8px;font-size:12px;font-weight:600;color:var(--mute)}
.lvls{display:flex;flex-direction:column;gap:2px}
.lv{display:grid;grid-template-columns:34px minmax(0,1fr) auto;align-items:center;gap:8px;border:0;background:none;text-align:left;padding:8px 8px;border-radius:7px;min-height:44px}
.lv:hover{background:var(--line2)}
.lv[aria-pressed=true]{background:var(--selbg);color:var(--ink)}
.lv .n{font-weight:700;font-size:15px}
.lv .m{height:4px;border-radius:2px;background:var(--line);overflow:hidden}.lv .m i{display:block;height:100%;background:currentColor;opacity:.85}
.lv .c{font-size:12px;color:var(--mute);font-variant-numeric:tabular-nums}
.lv[aria-pressed=true] .c{color:var(--ink2)}
.tog{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:7px 8px;border-radius:7px;font-size:14px;cursor:pointer;min-height:38px}
.tog:hover{background:var(--line2)}
.tog input{appearance:none;width:32px;height:18px;border-radius:9px;background:var(--line);position:relative;cursor:pointer;flex:none;transition:background .15s}
.tog input::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:var(--pane);transition:transform .15s}
.tog input:checked{background:var(--ink)}.tog input:checked::after{transform:translateX(14px)}
.sbtn{width:100%;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:var(--raise);font-size:14px;font-weight:500;min-height:42px}
.sbtn:hover{border-color:var(--mute)}
.sbtn kbd,.kb{font:500 11px var(--sans);color:var(--mute);border:1px solid var(--line);border-radius:4px;padding:1px 5px}
.sbtn.pri{background:var(--ink);color:var(--pane);border-color:var(--ink)}.sbtn.pri kbd{color:inherit;border-color:color-mix(in srgb,var(--pane) 40%,transparent)}
.zoom{display:grid;grid-template-columns:40px 1fr 40px;align-items:center;border:1px solid var(--line);border-radius:8px;background:var(--raise);overflow:hidden}
.zoom button{border:0;background:none;height:38px;font-size:14px;font-weight:600}
.zoom button:hover{background:var(--line2)}
.zoom output{text-align:center;font-size:13px;color:var(--ink2);font-variant-numeric:tabular-nums}
.side{container-type:inline-size}
.theme{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;background:var(--btn);border:1px solid var(--btnline);border-radius:8px;padding:2px}
.theme button{display:flex;align-items:center;justify-content:center;gap:5px;border:0;background:none;border-radius:6px;min-height:34px;font-size:12.5px;color:var(--ink2);padding:0 4px}
.theme button:hover{color:var(--ink)}
.theme button[aria-checked=true]{background:var(--raise);color:var(--ink);font-weight:600;box-shadow:0 0 0 1px var(--btnline)}
@container (max-width:200px){.theme span{display:none}}
.side .foot{margin-top:auto;display:flex;flex-direction:column;gap:8px}
.credit{font-size:11.5px;color:var(--mute);line-height:1.45;padding:0 6px}

/* ---------- index ---------- */
.index{background:var(--pane);border-right:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden}
.ihead{padding:14px 14px 10px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.search{display:flex;align-items:center;gap:8px;background:var(--raise);border:1px solid var(--line);border-radius:8px;padding:0 10px;min-height:40px}
.search:focus-within{border-color:var(--mute)}
.search input{border:0;background:none;flex:1;outline:none;font-size:15px;min-height:38px}
.search svg{color:var(--mute);flex:none}
.irow{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.irow b{font-size:15px}.irow span{font-size:12.5px;color:var(--mute)}
.kgrid{flex:1;overflow:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));align-content:start;padding:8px}
.k{position:relative;border:0;background:none;border-radius:7px;padding:8px 2px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:72px}
.k:hover{background:var(--line2)}
.k .g{font:500 28px/1.1 var(--mincho)}
.k .w{font-size:10.5px;color:var(--mute);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 4px}
.k[aria-current=true]{background:var(--ink);color:var(--raise)}.k[aria-current=true] .w{color:var(--raise);opacity:.75}
.k.known .g::after{content:"";position:absolute;top:7px;right:8px;width:6px;height:6px;border-radius:50%;background:var(--ok)}
.k .lt{position:absolute;top:5px;left:7px;font-size:10px;color:var(--mute)}
.empty{padding:28px 18px;color:var(--mute);font-size:14px}

/* ---------- entry ---------- */
.entry{background:var(--raise);overflow:auto;display:flex;flex-direction:column;container-type:inline-size;container-name:entry}
.ehead{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:28px;padding:28px clamp(20px,3vw,44px) 24px;border-bottom:1px solid var(--line);align-items:start}
.box{position:relative;width:clamp(150px,13vw,200px);aspect-ratio:1;border:1px solid var(--line);border-radius:6px;background:var(--pane)}
.box svg{position:absolute;inset:0;width:100%;height:100%}
.box .guide{stroke:var(--line);stroke-dasharray:2 3;stroke-width:.6;fill:none}
.box .s{fill:none;stroke:var(--ink);stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}
.box .num{font:600 6.5px var(--sans);fill:var(--sel)}
.box .fb{position:absolute;inset:0;display:grid;place-items:center;font:500 clamp(100px,10vw,140px)/1 var(--mincho)}
.boxtools{display:flex;justify-content:space-between;align-items:center;margin-top:8px;font-size:12.5px;color:var(--mute)}
.link{border:0;background:none;color:var(--sel);font-size:13px;font-weight:500;padding:4px 0}
.link:hover{text-decoration:underline}
.einfo{display:flex;flex-direction:column;gap:14px}
.title{display:flex;align-items:baseline;gap:16px;flex-wrap:wrap}
.title .big{font:700 64px/1 var(--mincho)}
.title h2{margin:0;font-size:26px;line-height:1.2;font-weight:600;text-wrap:balance}
.facts{display:flex;gap:18px;flex-wrap:wrap;font-size:13px;color:var(--mute)}
.facts b{color:var(--ink);font-weight:600;margin-right:4px}
.rd{display:grid;grid-template-columns:72px minmax(0,1fr);gap:8px 12px;align-items:center}
.rd dt{font-size:13px;color:var(--mute)}
.rd dd{margin:0;display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid transparent;border-radius:6px;padding:3px 10px 3px 11px;font:500 18px/1.4 var(--sans);display:inline-flex;align-items:center;gap:8px;min-height:36px}
.chip .ct{font-size:11.5px;font-weight:500;opacity:.7;font-variant-numeric:tabular-nums}
.chip .ok{opacity:.5}
.chip.on{background:var(--onbg);color:var(--on)}.chip.kun{background:var(--kunbg);color:var(--kun)}.chip.irr{background:var(--line2);color:var(--mute);font-size:14px}
.chip:hover{border-color:currentColor}
.chip[aria-pressed=true]{background:currentColor}.chip[aria-pressed=true] *{color:var(--raise)}
.chip[aria-pressed=true]{color:inherit}
.chip.on[aria-pressed=true]{background:var(--on);color:var(--raise)}.chip.kun[aria-pressed=true]{background:var(--kun);color:var(--raise)}.chip.irr[aria-pressed=true]{background:var(--mute);color:var(--raise)}
.chip[data-zero]{opacity:.45}
.usage{display:flex;flex-direction:column;gap:6px}
.usage .ub{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--line2);gap:2px}
.usage .ub button{border:0;padding:0;height:100%;min-width:3px}
.usage .ub .on{background:var(--on)}.usage .ub .kun{background:var(--kun)}.usage .ub .irr{background:var(--mute);opacity:.5}
.usage .ub button[aria-pressed=false]{opacity:.35}
.usage p{margin:0;font-size:12.5px;color:var(--mute)}
.eact{display:flex;flex-direction:column;gap:8px;align-items:stretch}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:7px 16px;border-radius:8px;border:1px solid var(--btnline);background:var(--btn);color:var(--ink);font-size:13.5px;font-weight:600;white-space:nowrap;transition:background .12s,border-color .12s}
.btn:hover{background:var(--btnh)}
.btn.pri{background:var(--ink);color:var(--raise);border-color:var(--ink)}.btn.pri:hover{background:color-mix(in srgb,var(--ink) 86%,var(--raise))}
.btn.learned{background:var(--ok);border-color:var(--ok);color:var(--raise)}
.btn.learned svg{stroke:currentColor}

.wbar{position:sticky;top:0;z-index:2;background:var(--raise);display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;justify-content:space-between;padding:12px clamp(20px,3vw,44px);border-bottom:1px solid var(--line)}
.wbar h3{margin:0;font-size:15px;font-weight:600;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.wbar h3 small{font-weight:400;color:var(--mute);font-size:13px}
.clr{border:1px solid var(--line);background:var(--pane);border-radius:6px;font-size:12.5px;padding:2px 8px}
.ctrls{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.seg{display:inline-flex;background:var(--pane);border:1px solid var(--line);border-radius:7px;padding:2px}
.seg button{border:0;background:none;padding:4px 11px;min-height:32px;font-size:13px;border-radius:5px;color:var(--ink2)}
.seg button[aria-pressed=true]{background:var(--raise);color:var(--ink);font-weight:600;box-shadow:0 0 0 1px var(--line)}
.dd{position:relative}
.ddb{display:inline-flex;align-items:center;gap:8px;min-height:36px;padding:5px 10px 5px 12px;border-radius:8px;border:1px solid var(--btnline);background:var(--btn);font-size:13px;white-space:nowrap}
.ddb:hover{background:var(--btnh)}
.ddb .dk{color:var(--mute)}.ddb .dv{font-weight:600}
.ddb svg{color:var(--mute);transition:transform .15s}
.ddb[aria-expanded=true]{border-color:var(--ink2)}.ddb[aria-expanded=true] svg{transform:rotate(180deg)}
.ddm{position:absolute;top:calc(100% + 6px);left:0;z-index:30;min-width:max(100%,250px);background:var(--raise);border:1px solid var(--btnline);border-radius:10px;padding:6px;box-shadow:0 14px 40px rgb(0 0 0 / .35),0 2px 6px rgb(0 0 0 / .2);display:none}
.dd.r .ddm{left:auto;right:0}
.dd.open .ddm{display:block}
.ddm h4{margin:4px 10px 6px;font-size:12px;font-weight:500;color:var(--mute)}
.ddo{display:grid;grid-template-columns:18px minmax(0,1fr);gap:2px 8px;width:100%;text-align:left;border:0;background:none;border-radius:7px;padding:8px 10px;font-size:13.5px;color:var(--ink);align-items:center}
.ddo:hover,.ddo:focus-visible{background:var(--btn);outline:none}
.ddo .ck{grid-row:span 2;opacity:0;color:var(--ink)}.ddo[aria-selected=true] .ck{opacity:1}
.ddo[aria-selected=true]{font-weight:600}
.ddo small{grid-column:2;font-size:12px;color:var(--mute);font-weight:400}
.tgl{display:inline-flex;align-items:center;gap:8px;min-height:36px;padding:5px 12px;border-radius:8px;border:1px solid var(--btnline);background:var(--btn);font-size:13px;font-weight:500}
.tgl:hover{background:var(--btnh)}
.tgl i{width:14px;height:14px;border-radius:4px;border:1.5px solid var(--mute);display:grid;place-items:center}
.tgl[aria-pressed=true]{border-color:var(--ink2)}.tgl[aria-pressed=true] i{background:var(--ink);border-color:var(--ink)}
.tgl[aria-pressed=true] i::after{content:"";width:7px;height:4px;border:2px solid var(--raise);border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}

.words{list-style:none;margin:0;padding:4px clamp(20px,3vw,44px) 30px}
.wr{display:grid;grid-template-columns:28px minmax(150px,220px) minmax(0,1fr) 128px 40px;gap:6px 20px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line2)}
.wr .wd{font:600 28px/1.3 var(--mincho);color:var(--ink)}
.wr .wd a{color:inherit;text-decoration:none;cursor:pointer}
.wr .wd a:hover{color:var(--sel)}
.wr .wd a.self{color:var(--sel)}
.wr ruby{ruby-position:over}
.wr rt{font:500 13px/1.3 var(--sans);color:var(--mute);padding-bottom:2px}
.wr rt.hl{font-weight:700;border-radius:3px}
.wr rt.hl.on{color:var(--on)}.wr rt.hl.kun{color:var(--kun)}
.wr .rl{font:500 18px/1.4 var(--sans);color:var(--ink2);letter-spacing:.02em}
.wr .rl .okr{color:var(--mute)}
mark{background:none;color:inherit}
mark.on,mark.kun{font-weight:700;border-radius:4px;padding:0 3px}
mark.on{background:var(--onbg);color:var(--on)}mark.kun{background:var(--kunbg);color:var(--kun)}
.wr .mn{font-size:14.5px;color:var(--ink2);margin-top:2px}
.use{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:500;margin-left:8px;white-space:nowrap}
.use::before{content:"";width:7px;height:7px;border-radius:2px;background:currentColor}
.use.on{color:var(--on)}.use.kun{color:var(--kun)}.use.irr{color:var(--mute)}
.wr .rk{font-size:13px;color:var(--mute);font-variant-numeric:tabular-nums;text-align:right}
.fq{display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.meter{display:inline-flex;gap:2px;align-items:flex-end;height:12px;cursor:help}
.meter i{width:4px;background:var(--line);border-radius:1px}
.meter i:nth-child(1){height:4px}.meter i:nth-child(2){height:6px}.meter i:nth-child(3){height:8px}.meter i:nth-child(4){height:10px}.meter i:nth-child(5){height:12px}
.meter i.f{background:var(--ink2)}
.fl{font-size:12px;color:var(--ink2);white-space:nowrap}
.wr .lvl{font-size:11.5px;color:var(--mute);white-space:nowrap}
.pager{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:20px clamp(20px,3vw,44px) 0}
.pnums{justify-content:center}
.pnums{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.pg{min-width:38px;height:38px;border-radius:7px;border:1px solid transparent;background:none;font-size:14px;font-variant-numeric:tabular-nums;color:var(--ink2)}
.pg:hover{border-color:var(--line)}
.pg[aria-current=true]{background:var(--ink);color:var(--raise);font-weight:600}
.gap{color:var(--mute);padding:0 4px}
.btn:disabled{opacity:.4;cursor:default}
.pinfo{margin:10px clamp(20px,3vw,44px) 0;font-size:12.5px;color:var(--mute);text-align:center}
.reveal{border:1px dashed var(--line);background:var(--pane);border-radius:6px;font-size:13px;padding:4px 12px;min-height:32px;color:var(--ink2)}
.play{width:40px;height:40px;border-radius:8px;border:1px solid transparent;background:none;color:var(--mute);display:grid;place-items:center}
.play:hover{border-color:var(--line);color:var(--ink)}
.play.playing{color:var(--sel)}.play.playing svg{animation:pl .8s ease-in-out infinite}
@keyframes pl{50%{transform:scale(1.15)}}
.more{display:block;margin:18px auto 0}

/* ---------- flashcards ---------- */
.fc{position:fixed;inset:0;z-index:20;background:color-mix(in srgb,var(--bg) 80%,transparent);backdrop-filter:blur(6px);display:none;place-items:center;padding:20px}
.fc.open{display:grid}
.card{width:min(620px,100%);max-height:calc(100vh / var(--z) - 40px);overflow:auto;background:var(--raise);border:1px solid var(--line);border-radius:12px;box-shadow:0 24px 80px rgb(0 0 0 / .45);display:flex;flex-direction:column}
.card .ch{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line);font-size:13px;color:var(--mute)}
.card .pbar{height:3px;background:var(--line2)}.card .pbar i{display:block;height:100%;background:var(--ink)}
.card .face{padding:28px 28px 22px;display:flex;flex-direction:column;gap:18px}
.card .gl{font:700 clamp(120px,20vw,180px)/1 var(--mincho);text-align:center}
.card .ans{display:none;flex-direction:column;gap:14px}
.card.rev .ans{display:flex}
.card .ans h3{margin:0;font-size:22px;text-align:center;font-weight:600}
.card .ex{list-style:none;margin:0;padding:0}

<script>
{
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store={get(k,d){try{const v=localStorage.getItem('jlptk.'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem('jlptk.'+k,JSON.stringify(v))}catch(e){}}};
const LV=[5,4,3,2,1];
const SPK='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16 9a4 4 0 0 1 0 6"/><path d="M18.5 6.5a8 8 0 0 1 0 11"/></svg>';
let K=[],KM=new Map(),W=[],WI=new Map(),IDX=new Map(),ST=null;
let st={tab:store.get('tab','words'),rsel:[],wordR:null,layout:store.get('layout','list'),hideMean:store.get('hideMean',false),view:'kanji',part:null,word:null,level:store.get('level',5),cur:store.get('cur',null),q:'',mode:store.get('mode','comp'),maxLv:store.get('maxLv',1),jlptOnly:store.get('jlptOnly',false),rmode:store.get('rmode','ruby'),sort:store.get('sort','freq'),page:0,rf:null};
let known=new Set(store.get('known',[])),revealed=new Set();
const hideKnown={checked:store.get('hideKnown',false)},byStroke={checked:store.get('byStroke',false)};
function idxOpts(){[['hideKnown',hideKnown],['byStroke',byStroke]].forEach(([id,o])=>{const b=document.getElementById('o-'+id);if(b){b.setAttribute('aria-checked',String(o.checked));b.setAttribute('aria-selected',String(o.checked))}})}
const kata2hira=s=>s.replace(/[ァ-ヶ]/g,c=>String.fromCharCode(c.charCodeAt(0)-0x60));
const hira2kata=s=>s.replace(/[ぁ-ゖ]/g,c=>String.fromCharCode(c.charCodeAt(0)+0x60));
const isK=c=>KM.has(c);
const clean=r=>r.replace(/[.\-]/g,'');
const narrow=()=>matchMedia('(max-width:760px)').matches;

let tt;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),4200)}

/* zoom */
const ZS=[.8,.9,1,1.1,1.25,1.4,1.6,1.8];let zi=ZS.indexOf(store.get('zoom',1));if(zi<0)zi=2;
function applyZoom(){const z=ZS[zi];document.documentElement.style.zoom=z;document.documentElement.style.setProperty('--z',z);const zv=$('#zval');if(zv)zv.textContent=Math.round(z*100)+'%';store.set('zoom',z)}
function zoomBy(d){zi=Math.min(ZS.length-1,Math.max(0,zi+d));applyZoom();try{applyW(false)}catch(e){}}
applyZoom();
/* collapsible navigation */
let navHidden=store.get('navHidden',false);
function applyNav(){document.body.classList.toggle('navhidden',navHidden);document.querySelectorAll('[data-navt]').forEach(b=>b.setAttribute('aria-expanded',String(!navHidden)));try{applyW(false)}catch(e){}}
function toggleNav(){navHidden=!navHidden;store.set('navHidden',navHidden);applyNav();const t=navHidden?document.querySelector('.hb.show'):document.querySelector('.brand .hb');if(t&&t.offsetParent)t.focus()}
applyNav();
/* theme: an inline color-scheme beats the stylesheet and the viewer's data-theme */
let theme=store.get('theme','system');
function applyTheme(){const r=document.documentElement;r.style.colorScheme=theme==='system'?'':theme;
 document.querySelectorAll('[data-theme-set]').forEach(b=>b.setAttribute('aria-checked',String(b.dataset.themeSet===theme)));
 const m=document.querySelector('meta[name="theme-color"]');const dark=theme==='dark'||(theme==='system'&&matchMedia('(prefers-color-scheme: dark)').matches&&!r.matches('[data-theme=light]'))||(theme==='system'&&r.matches('[data-theme=dark]'));
 if(m)m.content=dark?'#0e0e10':'#f1f1f2'}
applyTheme();

/* resizable panes */
const app=$('.app'),DEF={w1:232,w2:400},LIM={w1:[180,380],w2:[240,720]};
let W1=store.get('w1',DEF.w1),W2=store.get('w2',DEF.w2);
const twoPane=()=>matchMedia('(max-width:1180px)').matches;
function clampW(){const z=ZS[zi],total=app.getBoundingClientRect().width/z,minEntry=480;
 W1=Math.round(Math.min(LIM.w1[1],Math.max(LIM.w1[0],W1)));
 const used=twoPane()||navHidden?0:W1;W2=Math.round(Math.min(LIM.w2[1],Math.max(LIM.w2[0],Math.min(W2,total-used-minEntry))))}
function applyW(save){clampW();app.style.setProperty('--w1',W1+'px');app.style.setProperty('--w2',W2+'px');
 $('#rz1').setAttribute('aria-valuenow',W1);$('#rz2').setAttribute('aria-valuenow',W2);if(save){store.set('w1',W1);store.set('w2',W2)}}
function startDrag(which,e){
 e.preventDefault();const h=e.currentTarget;h.setPointerCapture(e.pointerId);h.classList.add('drag');document.body.classList.add('resizing');
 const z=ZS[zi],x0=e.clientX,a=W1,b=W2;
 const move=ev=>{const d=(ev.clientX-x0)/z;if(which===1)W1=a+d;else W2=b+d;applyW(false)};
 const up=()=>{h.classList.remove('drag');document.body.classList.remove('resizing');h.removeEventListener('pointermove',move);h.removeEventListener('pointerup',up);h.removeEventListener('pointercancel',up);applyW(true)};
 h.addEventListener('pointermove',move);h.addEventListener('pointerup',up);h.addEventListener('pointercancel',up)}
[1,2].forEach(n=>{const h=$('#rz'+n);
 h.addEventListener('pointerdown',e=>startDrag(n,e));
 h.addEventListener('dblclick',()=>{if(n===1)W1=DEF.w1;else W2=DEF.w2;applyW(true)});
 h.addEventListener('keydown',e=>{const d=e.key==='ArrowLeft'?-16:e.key==='ArrowRight'?16:0;if(!d&&e.key!=='Home')return;e.preventDefault();e.stopPropagation();
  if(e.key==='Home'){if(n===1)W1=DEF.w1;else W2=DEF.w2}else if(n===1)W1+=d;else W2+=d;applyW(true)})});
addEventListener('resize',()=>applyW(false));
applyW(false);

/* speech */
let tts=null,playingBtn=null;
const hasClaude=typeof claude!=='undefined'&&claude.use;
const capReady=hasClaude?Promise.resolve(claude.use('tts')).then(t=>{tts=t;if(t&&t.onState)t.onState(({state})=>{if(state!=='speaking')setPlaying(null)})}).catch(()=>{}):Promise.resolve();
let jaVoice=null;
function pickVoice(){try{const v=speechSynthesis.getVoices();jaVoice=v.find(x=>/^ja/i.test(x.lang)&&/natural|online|google/i.test(x.name))||v.find(x=>/^ja/i.test(x.lang))||null}catch(e){}}
try{pickVoice();speechSynthesis.addEventListener('voiceschanged',pickVoice)}catch(e){}
function setPlaying(b){if(playingBtn)playingBtn.classList.remove('playing');playingBtn=b;if(b)b.classList.add('playing')}
function webSpeak(text){
 try{if(!('speechSynthesis' in window))throw 0;pickVoice();
  if(!jaVoice){toast('No Japanese voice is installed. Add a Japanese voice in your system’s speech settings, then reopen the app.');setPlaying(null);return}
  const u=new SpeechSynthesisUtterance(text);u.voice=jaVoice;u.lang=jaVoice.lang;u.rate=.85;u.onend=u.onerror=()=>setPlaying(null);speechSynthesis.cancel();speechSynthesis.speak(u);
 }catch(e){toast('Audio isn’t available here.');setPlaying(null)}}
async function say(text,btn){
 if(!text)return;setPlaying(btn||null);await capReady;
 if(tts){try{await tts.speak(text,{language:'ja',rate:.9});setPlaying(null);return}catch(e){
  const code=e&&e.code;if(code==='viewer_stopped'){setPlaying(null);return}
  if(code==='rate_limited'){toast('Too many requests. Wait a moment and try again.');setPlaying(null);return}}}
 webSpeak(text)}

/* desktop install + icon */
function drawIcon(){const c=document.createElement('canvas');c.width=c.height=256;const x=c.getContext('2d');
 x.fillStyle='#19191c';x.beginPath();x.roundRect?x.roundRect(8,8,240,240,52):x.rect(8,8,240,240);x.fill();
 x.strokeStyle='rgba(255,255,255,.22)';x.setLineDash([6,9]);x.lineWidth=3;x.beginPath();x.moveTo(128,36);x.lineTo(128,220);x.moveTo(36,128);x.lineTo(220,128);x.stroke();
 x.fillStyle='#ededee';x.font='700 160px "Shippori Mincho B1", serif';x.textAlign='center';x.textBaseline='middle';x.fillText('漢',128,136);return c.toDataURL('image/png')}
if(hasClaude)Promise.resolve(claude.use('desktop')).then(async d=>{
 if(!d)return;
 if(d.app&&d.app.dock){document.fonts.load('700 160px "Shippori Mincho B1"').finally(()=>d.app.dock.setIcon(drawIcon()).catch(()=>{}));
  if(d.window)d.window.setOptions({minWidth:760,minHeight:560,backgroundColor:'#0e0e10'}).catch(()=>{})}
 else if(d.install&&(await d.install.state())==='available'){const b=$('#install');b.hidden=false;b.onclick=()=>d.install.request().then(r=>{if(r==='installed')b.hidden=true}).catch(()=>{})}
}).catch(()=>{});

/* reading alignment */
const REN={'か':'が','き':'ぎ','く':'ぐ','け':'げ','こ':'ご','さ':'ざ','し':'じ','す':'ず','せ':'ぜ','そ':'ぞ','た':'だ','ち':'ぢじ','つ':'づず','て':'で','と':'ど','は':'ばぱ','ひ':'びぴ','ふ':'ぶぷ','へ':'べぺ','ほ':'ぼぽ'};
const IF={'う':'い','く':'き','ぐ':'ぎ','す':'し','つ':'ち','ぬ':'に','ぶ':'び','む':'み','る':'り'};
function variants(b){const o=new Set([b]);for(const v of (REN[b[0]]||''))o.add(v+b.slice(1));
 for(const x of [...o])if(x.length>1&&'つちくき'.includes(x.slice(-1)))o.add(x.slice(0,-1)+'っ');return [...o]}
const CC=new Map();
function cands(c){
 if(CC.has(c))return CC.get(c);const k=KM.get(c),L=[],seen=new Set();
 const add=(v,type,r)=>{if(v&&!seen.has(type+v)){seen.add(type+v);L.push({v,type,r})}};
 k[5].forEach(r=>{variants(kata2hira(r.replace(/-/g,''))).forEach(v=>add(v,'on',r))});
 k[6].forEach(r=>{const s=kata2hira(r.replace(/-/g,''));const [a,ok='']=s.split('.');const f=[a];
  if(ok){f.push(a+ok);const l=ok.slice(-1);if(IF[l])f.push(a+ok.slice(0,-1)+IF[l]);if(l==='る')f.push(a+ok.slice(0,-1))}
  f.forEach(x=>x&&variants(x).forEach(v=>add(v,'kun',r)))});
 L.sort((a,b)=>b.v.length-a.v.length);CC.set(c,L);return L}
const AC=new Map();
function align(word,reading){
 const key=word+'|'+reading;if(AC.has(key))return AC.get(key);
 const R=kata2hira(reading),segs=[];
 for(const ch of word){if(isK(ch)||ch==='々')segs.push({k:ch});else if(segs.length&&segs.at(-1).s!=null)segs.at(-1).s+=ch;else segs.push({s:ch})}
 const go=(i,p,prev)=>{
  if(i===segs.length)return p===R.length?{cost:0,parts:[]}:null;
  const s=segs[i];
  if(s.s!=null){const t=kata2hira(s.s);if(!R.startsWith(t,p))return null;const n=go(i+1,p+t.length,null);return n&&{cost:n.cost,parts:[{s:s.s},...n.parts]}}
  const cs=s.k==='々'?(prev?variants(prev.v).map(v=>({v,type:prev.type,r:prev.r})):[]):cands(s.k);let best=null;
  for(const cd of cs){if(!R.startsWith(cd.v,p))continue;const n=go(i+1,p+cd.v.length,cd);
   if(n&&(!best||n.cost<best.cost)){best={cost:n.cost,parts:[{c:s.k,...cd},...n.parts]};if(!best.cost)return best}}
  if(!best)for(let l=1;l<=4&&p+l<=R.length;l++){const n=go(i+1,p+l,null);if(n&&(!best||n.cost+10<best.cost))best={cost:n.cost+10,parts:[{c:s.k,v:R.slice(p,p+l),type:'?'},...n.parts]}}
  return best};
 let res=null;try{res=go(0,0,null)}catch(e){}
 const out=res&&!res.cost?res.parts:null;AC.set(key,out);return out}
function useOf(w,c){const a=align(w[0],w[1]);if(!a)return{irr:true};const p=a.find(x=>x.c===c);return p?{type:p.type,v:p.v,r:p.r}:{irr:true}}
const TY={on:'on’yomi',kun:'kun’yomi'};
const rkey=u=>u.irr?'irr':u.r;

/* index */
function levels(){
 $('#levels').innerHTML=LV.map(n=>{const L=K.filter(k=>k[1]===n),kn=L.filter(k=>known.has(k[0])).length;
  return `<button class="lv" data-lv="${n}" aria-pressed="${!st.q&&st.level===n}"><span class="n">N${n}</span><span class="m"><i style="width:${L.length?100*kn/L.length:0}%"></i></span><span class="c">${kn}/${L.length}</span></button>`}).join('')}
function kanjiList(){return list()}
function list(){
 let L;
 if(st.q){const q=st.q.trim().toLowerCase(),kana=kanaOf(st.q.trim());const chars=[...st.q].filter(isK);
  const mre=/^[a-z' -]+$/.test(q)?new RegExp('\\b'+q.replace(/[^a-z' -]/g,'')):null;
  L=chars.length?[...new Set(chars)].map(c=>KM.get(c)):K.filter(k=>(mre&&k[4].some(m=>mre.test(m.toLowerCase())))||(kana&&[...k[5],...k[6]].some(r=>kata2hira(clean(r)).startsWith(kana))));
 } else L=K.filter(k=>k[1]===st.level);
 if(hideKnown.checked)L=L.filter(k=>!known.has(k[0]));
 if(byStroke.checked)L=[...L].sort((a,b)=>a[2]-b[2]);
 return L}
function grid(){
 const L=list(),ws=st.q?wordSearch(st.q.trim()):[];

function quizPool(){
 const lv=new Set(K.filter(k=>k[1]===st.level).map(k=>k[0])),seen=new Set(),pool=[];
 for(const c of lv)for(const i of (IDX.get(c)||[])){const w=W[i];if(seen.has(w[0]))continue;seen.add(w[0]);
  if(/[〜～~]/.test(w[0])||(w[4]||0)<3||[...w[0]].length<2)continue;const ks=[...w[0]].filter(isK);if(ks.length<2&&!w[3])continue;if(w[6])continue;
  if(!ks.every(x=>KM.get(x)[1]>=st.level))continue;pool.push(w)}
 return pool.sort((a,b)=>b[4]-a[4]).slice(0,260)}
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const gloss=w=>w[2].split(';')[0].trim();
function nearWords(w,pool){const ks=new Set([...w[0]].filter(isK)),sim=new Set();
 ks.forEach(c=>((PARTS&&PARTS.sim[c])||[]).forEach(x=>sim.add(x)));
 const score=o=>{let s=0;for(const ch of o[0]){if(sim.has(ch))s+=3;else if(ks.has(ch))s+=2}return s+Math.random()};
 return pool.filter(o=>o[0]!==w[0]).map(o=>[score(o),o]).sort((a,b)=>b[0]-a[0]).map(x=>x[1])}
function makeQ(w,type,pool){
 const lv=st.level;
 if(type==='kread'){const a=align(w[0],w[1]);const parts=a?a.filter(p=>p.c&&p.c!=='々'&&p.type!=='?'):[];
  const pick=parts.filter(p=>KM.get(p.c)[1]===lv)[0]||parts[0];if(!pick)return null;
  const k=KM.get(pick.c),opts=new Set([pick.v]);
  const own=[...k[5].map(r=>kata2hira(r.replace(/-/g,''))),...k[6].map(r=>kata2hira(clean(r.split('.')[0])))].filter(Boolean);
  for(const r of shuffle(own)){if(opts.size>=4)break;if(r!==pick.v)opts.add(r)}
  for(const o of shuffle(pool)){if(opts.size>=4)break;const al=align(o[0],o[1]);const p=al&&al.find(x=>x.c&&x.type!=='?'&&x.c!==pick.c);if(p&&p.v!==pick.v)opts.add(p.v)}
  if(opts.size<3)return null;return{type,w,c:pick.c,ans:pick.v,ptype:pick.type,opts:shuffle([...opts])}}
 if(type==='mean'){const ans=gloss(w),opts=new Set([ans]);
  for(const o of shuffle(pool)){if(opts.size>=4)break;const g=gloss(o);if(o[0]!==w[0]&&g.toLowerCase()!==ans.toLowerCase()&&!opts.has(g))opts.add(g)}
  return{type,w,ans,opts:shuffle([...opts])}}
 if(type==='rev'||type==='listen'){const ans=w[0],opts=[ans],g=gloss(w).toLowerCase(),r=kata2hira(w[1]);
  for(const o of nearWords(w,pool)){if(opts.length>=4)break;if(opts.includes(o[0]))continue;if(type==='rev'&&gloss(o).toLowerCase()===g)continue;if(type==='listen'&&kata2hira(o[1])===r)continue;opts.push(o[0])}
  if(opts.length<4)return null;return{type,w,ans,opts:shuffle(opts)}}
 return{type:'typ',w,ans:kata2hira(w[1])}}

function checkBackup(text){
 let o;try{o=JSON.parse(text)}catch(e){return settingsView('<b>That isn’t a backup file.</b> Choose a file saved from this app, or paste its full text.')}
 if(!o||o.app!=='jlpt-kanji-compounds'||!o.data)return settingsView('<b>That file isn’t a backup from this app.</b>');
 let kn=0,rv=0;try{kn=JSON.parse(o.data.known||'[]').length;rv=Object.keys(JSON.parse(o.data.srs||'{}')).length+Object.keys(JSON.parse(o.data.srsW||'{}')).length}catch(e){}
 bkPending=o;settingsView(`<b>Backup from ${esc(new Date(o.saved).toLocaleString())}</b><span>${kn} learned kanji and ${rv} cards in reviews. Restoring replaces everything saved in this browser now.</span><div class="row left"><button class="btn pri" id="bk-apply">Replace my progress</button><button class="btn" id="bk-cancel">Cancel</button></div>`)}
async function saveBackup(){
 const json=JSON.stringify(backupData()),name=`jlpt-kanji-backup-${new Date().toISOString().slice(0,10)}.json`;
 try{const dl=typeof claude!=='undefined'&&claude.use?await claude.use('downloads'):null;
  if(dl){await dl.save({filename:name,data:json});toast('Backup saved.');return}}catch(e){if(e&&e.code==='declined'){toast('Save cancelled.');return}}
 try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([json],{type:'application/json'}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);toast('Backup saved to your downloads.')}
 catch(e){toast('Saving isn’t available here. Use “Copy backup text” instead.')}}

function modalClick(e){
 const m=e.target.closest('[data-m]');
 if(m){const a=m.dataset.m;
  if(a==='close')closeModal();else if(a==='go'){showCard()}else if(a==='more'){const nw=newList(5);sess={mode:'srs',queue:nw.map(c=>({t:'k',id:c,isNew:true})),i:0,total:nw.length,again:0,done:0};showCard()}
  else if(a==='cram')startCram();else if(a==='reveal'){$('#card').classList.add('rev');$('#card .q')?.remove()}
  else if(a==='progress'){closeModal();showView('progress')}else if(a==='qgo')quizGo(false);else if(a==='qretry')quizGo(true);else if(a==='qnew')quizStart();
  else if(a==='qadd'){qz.wrong.forEach(q=>addWordReview(q.w));toast(`${qz.wrong.length} word${qz.wrong.length>1?'s':''} added to your reviews.`);m.disabled=true;updateBadge()}
  else if(a==='qnext'){qz.i++;showQ()}
  return true}
 const g=e.target.closest('[data-g]');if(g){grade(+g.dataset.g);return true}
 const qo=e.target.closest('[data-qo]');if(qo){const [k,v]=qo.dataset.qo.split(':');qopt[k]=k==='len'?+v:v;store.set('qopt',qopt);quizStart();return true}
 const qa=e.target.closest('[data-qa]');if(qa){answer(+qa.dataset.qa);return true}
 const id=e.target.closest('button')?.id;
 if(id==='bk-save'){saveBackup();return true}
 if(id==='bk-copy'){const t=JSON.stringify(backupData());navigator.clipboard.writeText(t).then(()=>toast('Backup text copied. Paste it somewhere safe.'),()=>toast('Copying isn’t allowed here.'));return true}
 if(id==='bk-paste'){checkBackup($('#bk-text').value);return true}
 if(id==='bk-cancel'){bkPending=null;settingsView();return true}
 if(id==='bk-apply'&&bkPending){try{Object.keys(backupData().data).forEach(k=>localStorage.removeItem('jlptk.'+k));for(const [k,v] of Object.entries(bkPending.data))localStorage.setItem('jlptk.'+k,v)}catch(e){toast('Restoring failed: this browser blocks saving.');return true}
  toast('Progress restored. Reloading…');setTimeout(()=>location.reload(),600);return true}
 return false}

function modalKey(e){
 if(e.key==='Escape'){closeModal();return}
 if(mview==='settings')return;
 const card=$('#card');
 if(qz){
  if(e.target.id==='qin')return;
  if(qz.i>=qz.qs.length)return;
  const q=qz.qs[qz.i];
  if(e.key===' '&&q.type==='listen'&&!qz.answered){e.preventDefault();say(q.w[1],document.querySelector('.bigplay'));return}
  if(e.key==='Enter'&&qz.answered){e.preventDefault();qz.i++;showQ();return}
  if(/^[1-4]$/.test(e.key)&&!qz.answered&&q.opts){e.preventDefault();const i=+e.key-1;if(i<q.opts.length)answer(i)}
  return}
 if(!sess){if(e.key==='Enter'){const b=card.querySelector('[data-m="qgo"]');if(b&&!b.disabled){e.preventDefault();b.click()}}return}
 if(sess.i>=sess.queue.length&&sess.queue.length)return;
 if(!card.querySelector('.face .gl')){if(e.key==='Enter'){const b=card.querySelector('.btn.pri');if(b){e.preventDefault();b.click()}}return}
 if(!card.classList.contains('rev')){if(e.key===' '||e.key==='Enter'){e.preventDefault();card.classList.add('rev');card.querySelector('.q')?.remove()}return}
 if(sess.mode==='cram'){if(e.key==='1')grade(1);if(e.key==='2'||e.key===' '||e.key==='Enter'){e.preventDefault();grade(3)}return}
 if(/^[1-4]$/.test(e.key))grade(+e.key);else if(e.key===' '||e.key==='Enter'){e.preventDefault();grade(3)}}

/* ---------- extra clicks: navigation, tabs, view options, word reviews, parts finder ---------- */
function extraClick(e){
 const t=e.target.closest('[data-tab]');if(t){st.tab=t.dataset.tab;store.set('tab',st.tab);const sc=$('#entry').scrollTop;entry();$('#entry').scrollTop=sc;return true}
 const rs=e.target.closest('[data-reset]');if(rs){const k=rs.dataset.reset;const D={maxLv:1,rmode:'ruby',sort:'freq',jlptOnly:false,hideMean:false};
  if(k==='rf')st.rf=null;else{st[k]=D[k];store.set(k==='sort'?'sort':k,st[k])}st.page=0;revealed.clear();const sc=$('#entry').scrollTop;entry();$('#entry').scrollTop=sc;return true}
 const rd=e.target.closest('[data-rad]');if(rd&&!rd.disabled){const p=rd.dataset.rad;st.rsel=st.rsel||[];st.rsel=st.rsel.includes(p)?st.rsel.filter(x=>x!==p):[...st.rsel,p];const sc=$('#entry').scrollTop;entry();$('#entry').scrollTop=sc;return true}
 const wr=e.target.closest('[data-wr]');if(wr){openWord(wr.dataset.w,wr.dataset.wr);return true}
 const cf=e.target.closest('[data-cfg]');if(cf&&mview==='settings'){const [k,v]=cf.dataset.cfg.split(':');cfg[k]=+v;store.set('cfg',cfg);updateBadge();settingsView();return true}
 const th=e.target.closest('[data-theme-set]');if(th&&mview==='settings'){theme=th.dataset.themeSet;store.set('theme',theme);applyTheme();settingsView();return true}
 const id=e.target.closest('button')?.id;if(!id)return false;
 if(id==='nav-settings'||id==='nav-settings2'){settingsView();return true}
 if(id==='nav-weak'){showView('weak');return true}
 if(id==='nav-parts'){showView('radicals');return true}
 if(id==='nav-progress'){showView('progress');return true}
 if(id==='rad-clear'){st.rsel=[];entry();return true}
 if(id==='weak-practise'){startCram(weakList().slice(0,20).map(x=>x[0]));return true}
 if(id==='weak-addwords'){Object.keys(qmissW).forEach(k=>{const w=wordByKey(k);if(w&&qmissW[k]>0)addWordReview(w)});toast('Words added to your reviews.');updateBadge();return true}
 if(id==='wrev'){const w=W.find(x=>x[0]===st.word&&x[1]===st.wordR)||W[WI.get(st.word)];if(srsW[wkey(w)]){removeWordReview(w);toast('Removed from your reviews.')}else{addWordReview(w);toast('Added. It will come up in your next review.')}updateBadge();const sc=$('#entry').scrollTop;entry();$('#entry').scrollTop=sc;return true}
 if(id==='zin'||id==='zout'){zoomBy(id==='zin'?1:-1);return true}
 return false}

/* ---------- search helpers ---------- */
function kanaOf(q){if(/[ぁ-ゖァ-ヺー]/.test(q))return kata2hira(q);if(/^[a-z' -]+$/i.test(q)&&window.wanakana){const h=wanakana.toHiragana(q.replace(/[\s']/g,''));return /^[ぁ-ゖー]+$/.test(h)?h:null}return null}
function wordSearch(q){
 if(!q)return[];const kana=kanaOf(q),hasK=/[一-龯々]/.test(q),latin=/^[a-z' -]+$/i.test(q);
 if(hasK&&[...q].filter(isK).length<2&&q.length<2)return[];
 const re=latin&&q.length>=3?new RegExp('\\b'+q.replace(/[^a-z' -]/gi,''),'i'):null,out=[];
 for(const w of W){if(out.length>=40)break;
  if((hasK&&w[0].includes(q))||(kana&&kana.length>=2&&(kata2hira(w[1]).startsWith(kana)||w[0]===q))||(re&&re.test(gloss(w))))out.push(w)}
 return out}

/* events */
document.addEventListener('click',e=>{
 const ddo=e.target.closest('.ddo');if(ddo){const id=ddo.closest('.dd').dataset.dd;closeDD(false);setOpt(id,ddo.dataset.ddv);return}
 const ddb=e.target.closest('.ddb');if(ddb){const d=ddb.closest('.dd');d.classList.contains('open')?closeDD(false):openDD(d);return}
 if(!e.target.closest('.dd'))closeDD(false);
 if(modal().classList.contains('open')){if(e.target.id==='fc'){closeModal();return}if(modalClick(e))return}
 if(extraClick(e))return;
 if(e.target.closest('[data-navt]')){toggleNav();return}
 const pt=e.target.closest('[data-part]');if(pt){st.part=st.part===pt.dataset.part?null:pt.dataset.part;const sc=$('#entry').scrollTop;entry();$('#entry').scrollTop=sc;return}
 const cf=e.target.closest('[data-cfg]');if(cf){const [k,v]=cf.dataset.cfg.split(':');cfg[k]=+v;store.set('cfg',cfg);updateBadge();const sc=$('#entry').scrollTop;entry();$('#entry').scrollTop=sc;return}
 const rf=e.target.closest('[data-rf]');if(rf){st.rf=st.rf===rf.dataset.rf?null:rf.dataset.rf;st.page=0;if(rf.dataset.say&&st.rf)say(rf.dataset.say,null);const sc=$('#entry').scrollTop;entry();$('#entry').scrollTop=sc;return}
 const sy=e.target.closest('[data-say]');if(sy){say(sy.dataset.say,sy);return}
 const rm=e.target.closest('[data-revm]');if(rm){revealed.add('m:'+rm.dataset.revm);const n=rm.nextElementSibling;if(n){n.hidden=false;n.classList.add('shown')}rm.remove();return}
 const th=e.target.closest('[data-theme-set]');if(th){theme=th.dataset.themeSet;store.set('theme',theme);applyTheme();return}
 const ly=e.target.closest('[data-layout]');if(ly){st.layout=ly.dataset.layout;store.set('layout',st.layout);const sc=$('#entry').scrollTop;entry();$('#entry').scrollTop=sc;return}
 const rv=e.target.closest('.reveal');if(rv){revealed.add(rv.dataset.rev);const n=rv.nextElementSibling;if(n)n.hidden=false;rv.remove();say(rv.dataset.r);return}
 const lv=e.target.closest('[data-lv]');if(lv){st.level=+lv.dataset.lv;st.q='';$('#q').value='';store.set('level',st.level);document.body.classList.remove('detail');levels();grid();$('#kgrid').scrollTop=0;return}
 const kk=e.target.closest('[data-k]');if(kk){open(kk.dataset.k);return}
 const ww=e.target.closest('[data-w]');if(ww){openWord(ww.dataset.w,ww.dataset.wr||ww.dataset.wr2);return}
 const pg=e.target.closest('[data-page]');if(pg){if(!pg.disabled)goPage(+pg.dataset.page);return}
 const md=e.target.closest('[data-mode]');if(md){st.mode=md.dataset.mode;st.page=0;store.set('mode',st.mode);entry();return}
 const id=e.target.closest('button')?.id;
 if(id==='zin')zoomBy(1);if(id==='zout')zoomBy(-1);
 if(id==='nav-review'||id==='pv-review')startReview();if(id==='nav-quiz'||id==='pv-quiz')quizStart();
 if(id==='replay')animate();
 if(id==='back'){document.body.classList.remove('detail');grid();scrollTo({top:0})}
 if(id==='sayk'){const k=KM.get(st.cur);say([...k[5],...k[6].map(clean)].join('、'),e.target.closest('button'))}
 if(id==='hideMean'){st.hideMean=!st.hideMean;store.set('hideMean',st.hideMean);revealed.clear();const sc=$('#entry').scrollTop;entry();$('#entry').scrollTop=sc;$('#hideMean')?.focus()}
 if(id==='jlptOnly'){st.jlptOnly=!st.jlptOnly;st.page=0;store.set('jlptOnly',st.jlptOnly);const sc=$('#entry').scrollTop;entry();$('#entry').scrollTop=sc;$('#jlptOnly')?.focus()}
 if(id==='known'){const c=st.cur;known.has(c)?known.delete(c):known.add(c);store.set('known',[...known]);levels();grid();const sc=$('#entry').scrollTop;entry();$('#entry').scrollTop=sc}
});
document.addEventListener('change',e=>{const id=e.target.id;const keep=()=>{const sc=$('#entry').scrollTop;entry();$('#entry').scrollTop=sc};
});
let qt;$('#q').addEventListener('input',e=>{clearTimeout(qt);qt=setTimeout(()=>{st.q=e.target.value.trim();levels();grid();
 const ch=[...st.q].filter(isK);if(st.q.length>=2&&WI.has(st.q)&&!narrow())openWord(st.q);else if(ch.length===1&&st.q.length===1)open(ch[0]);else if(narrow())document.body.classList.remove('detail')},180)});
document.addEventListener('keydown',e=>{
 if((e.ctrlKey||e.metaKey)&&(e.key==='b'||e.key==='B')){e.preventDefault();toggleNav();return}
 if((e.ctrlKey||e.metaKey)&&['=','+','-','0'].includes(e.key)){e.preventDefault();if(e.key==='0'){zi=2;applyZoom()}else zoomBy(e.key==='-'?-1:1);return}
 if(modal().classList.contains('open')){modalKey(e);return}
 if(e.target.matches('input,select')){if(e.key==='Escape')e.target.blur();return}
 if(e.key==='/'){e.preventDefault();$('#q').focus();return}
 if(e.key===']'){goPage(st.page+1);return}
 if(e.key==='['){if(st.page>0)goPage(st.page-1);return}
 if(e.key==='r'||e.key==='R'){startReview();return}
 if(e.key==='q'||e.key==='Q'){quizStart();return}
 if(e.key==='ArrowRight'||e.key==='ArrowLeft'){
  const L=list();const i=L.findIndex(k=>k[0]===st.cur);if(i<0)return;
  const n=L[i+(e.key==='ArrowRight'?1:-1)];if(n){e.preventDefault();open(n[0])}}});

Promise.all([fetch('kanji.json').then(r=>r.json()),fetch('words.json').then(r=>r.json())]).then(([k,w])=>{
 K=k;K.forEach(x=>KM.set(x[0],x));W=w;W.forEach((x,i)=>WI.set(x[0],i));
 W.forEach((x,i)=>{for(const c of new Set(x[0]))if(KM.has(c)){let a=IDX.get(c);if(!a)IDX.set(c,a=[]);a.push(i)}});
 if(!st.cur||!KM.has(st.cur))st.cur=K.find(x=>x[1]===st.level)[0];
 if(!narrow())document.body.classList.add('detail');
 levels();grid();entry();updateBadge();idxOpts();
 fetch('parts.json').then(r=>r.json()).then(p=>{PARTS=p;if(st.view!=='word'&&st.view!=='progress'){updateBadge();const sc=$('#entry').scrollTop;entry();$('#entry').scrollTop=sc}}).catch(()=>{});
 fetch('strokes.json').then(r=>r.json()).then(s=>{ST=s;const sc=$('#entry').scrollTop;entry();$('#entry').scrollTop=sc}).catch(()=>{});
}).catch(()=>{$('#entry').innerHTML='<div class="empty">The kanji data didn’t load. Reload the app to try again.</div>';$('#gtitle').textContent='Not loaded'});
}
</script>
